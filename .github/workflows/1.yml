name: Build and Release Binaries32

on:
  push:
    tags:
      - 'v*'    # 仅在 push tag 时触发（发布版本时）
  workflow_dispatch:

jobs:
  build:
    name: Build cloudflared for multiple architectures
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: amd64
            goarch: amd64
            goarm: ""
          - name: arm64
            goarch: arm64
            goarm: ""
          - name: armv7
            goarch: arm
            goarm: "7"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          mkdir -p out
          go build -ldflags="-s -w" -o out/cloudflared-linux-${{ matrix.name }} ./cmd/cloudflared

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudflared-${{ matrix.name }}
          path: out/cloudflared-linux-${{ matrix.name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download amd64 build
        uses: actions/download-artifact@v4
        with:
          name: cloudflared-amd64
          path: dist/

      - name: Download arm64 build
        uses: actions/download-artifact@v4
        with:
          name: cloudflared-arm64
          path: dist/

      - name: Download armv7 build
        uses: actions/download-artifact@v4
        with:
          name: cloudflared-armv7
          path: dist/

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          files: |
            dist/cloudflared-linux-amd64
            dist/cloudflared-linux-arm64
            dist/cloudflared-linux-armv7
